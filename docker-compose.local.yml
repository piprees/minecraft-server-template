# Local dev overrides - committed, not generated.
# Disables whitelist (PlayerDB lookups fail without auth servers).
# Disables autopause (causes watchdog issues in Docker on Mac).
#
# The entrypoint wrapper unsets WHITELIST before exec'ing the real
# entrypoint. Setting it to "" in environment isn't enough — the itzg
# image treats any defined value (even empty) as "manage this list",
# which re-enables white-list=true in server.properties. Compose can't
# truly unset a variable defined in the main file, so we unset at runtime.
# OPS is kept — it grants op without triggering whitelist.
services:
  mc:
    entrypoint:
      - /bin/bash
      - -c
      - unset WHITELIST; exec /image/scripts/start
    # A rolled winner is written into the consumer's committed overlay, so the
    # mod needs it mounted. Local only: production must never write to the
    # overlay, and its absence there is what makes `winner` refuse.
    volumes:
      - ./overlay/config/custom-dimensions/dimensions:/overlay-dimensions
    environment:
      ONLINE_MODE: "FALSE"
      ENABLE_WHITELIST: "FALSE"
      ENFORCE_WHITELIST: "FALSE"
      OVERRIDE_WHITELIST: "FALSE"
      ENABLE_AUTOPAUSE: "FALSE"
  nav-proxy:
    ports:
      - "${WEB_PORT:-8080}:80"
