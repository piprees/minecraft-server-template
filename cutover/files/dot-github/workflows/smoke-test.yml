name: Smoke Test

# Boots the real stack from this checkout: the seed image built from
# docker/defaults-seed, the itzg image and Fabric loader from
# minecraft-versions.tsv, every mod of the version's list resolved by the
# seed, the version's config overlay and the in-house mods of its manifest.
# Then four gates, each a script that runs the same way on a workstation:
#   boot     scripts/smoke.sh check: Done, no mod-loading failure, the
#            pack installed at start-up, the admin mods loaded; every WARN
#            and ERROR line listed in the artifact for triage
#   bedrock  scripts/e2e/bedrock-ping.py: Geyser's NetherNet signaling
#            answers on 19132/tcp with the server's MOTD
#   join     scripts/e2e/vanilla-join.sh: the unmodded client joins and
#            stays 60 s; a disconnect fails the job with its reason
#   parity   scripts/admin-parity-check.sh, run while that client is online:
#            every RCON command discord-sync and deploy.sh send
# release.yml gates every release on it; dep-review.yml calls it for every
# dependency update.

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to boot instead of the caller's ref (dep-review.yml passes the PR head)"
        required: false
        type: string
        default: ''
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/**'
      - 'docker/defaults-seed/**'
      - 'docker-compose.yml'
      - 'scripts/deploy.sh'
      - 'scripts/lib.sh'
      - 'scripts/minecraft-versions.tsv'
      - 'scripts/game-rules.tsv'
      - 'scripts/smoke.sh'
      - 'scripts/admin-parity-check.sh'
      - 'scripts/e2e/vanilla-join.sh'
      - '.github/workflows/smoke-test.yml'

permissions:
  contents: read

concurrency:
  group: smoke-test-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  MOD_CACHE_DIR: ${{ github.workspace }}/.modcache

jobs:
  boot-join-parity:
    name: Boot, join with the vanilla client, check admin parity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Read the Minecraft version
        id: mc
        run: |
          source scripts/lib.sh
          v="$(mc_version)"
          {
            echo "version=$v"
            echo "java=$(mc_version_field java "$v")"
            echo "mod_list=$(mc_mod_list . "$v" | sed 's|^\./||')"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.mc.outputs.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore mod cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.modcache
          key: mc-jars-${{ steps.mc.outputs.version }}-${{ hashFiles(steps.mc.outputs.mod_list) }}
          restore-keys: mc-jars-${{ steps.mc.outputs.version }}-

      - name: Restore the vanilla client
        uses: actions/cache@v6
        with:
          path: ~/.cache/vanilla-client
          key: vanilla-client-${{ steps.mc.outputs.version }}

      - name: Install the headless display tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb xdotool imagemagick mesa-utils libgl1-mesa-dri mesa-vulkan-drivers

      - name: Prepare the stack
        run: ./scripts/smoke.sh prepare

      - name: Boot the stack
        run: ./scripts/smoke.sh up

      - name: Boot gate
        id: boot
        run: ./scripts/smoke.sh check "$RUNNER_TEMP/boot.txt"

      - name: Bedrock ping
        if: always() && steps.boot.outcome != 'skipped'
        run: |
          python3 scripts/e2e/bedrock-ping.py 127.0.0.1 19132 --tries 15 --timeout 2 \
            --expect "CI smoke test" | tee "$RUNNER_TEMP/bedrock-ping.txt"

      - name: Admin parity with no player online
        if: always() && steps.boot.outcome != 'skipped'
        run: ./scripts/admin-parity-check.sh --out "$RUNNER_TEMP/admin-parity-noplayer.txt"

      - name: Vanilla client join gate and admin parity with the player
        if: always() && steps.boot.outcome != 'skipped'
        run: |
          ./scripts/e2e/vanilla-join.sh --server 127.0.0.1:25577 --out "$RUNNER_TEMP/vanilla-join" \
            --during "./scripts/admin-parity-check.sh --player VanillaGate --out '$RUNNER_TEMP/admin-parity.txt'"
          if [[ ! -s "$RUNNER_TEMP/admin-parity.txt" ]]; then
            echo "::error::the admin parity check wrote nothing"
            exit 1
          fi
          if grep -q '^FAIL' "$RUNNER_TEMP/admin-parity.txt"; then
            grep '^FAIL' "$RUNNER_TEMP/admin-parity.txt"
            echo "::error::admin parity failed"
            exit 1
          fi

      - name: Job summary
        if: always()
        run: |
          {
            [[ -f "$RUNNER_TEMP/vanilla-join/summary.md" ]] && cat "$RUNNER_TEMP/vanilla-join/summary.md"
            echo ""
            echo "### Boot gate"
            echo '```'
            sed -n '/^## Gate/,/^## WARN/p' "$RUNNER_TEMP/boot.txt" 2> /dev/null | sed '$d'
            echo '```'
            echo "### Admin parity"
            echo '```'
            grep -E '^(FAIL|## )' "$RUNNER_TEMP/admin-parity.txt" 2> /dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/artifact"
          docker logs mc > "$RUNNER_TEMP/artifact/mc.log" 2>&1 || true
          docker logs seed > "$RUNNER_TEMP/artifact/seed.log" 2>&1 || true
          cp -r "$RUNNER_TEMP/vanilla-join" "$RUNNER_TEMP/artifact/" 2> /dev/null || true
          rm -rf "$RUNNER_TEMP/artifact/vanilla-join/game"
          cp "$RUNNER_TEMP/vanilla-join/game/logs/latest.log" "$RUNNER_TEMP/artifact/client-latest.log" 2> /dev/null || true
          cp "$RUNNER_TEMP"/boot.txt "$RUNNER_TEMP"/admin-parity*.txt "$RUNNER_TEMP"/bedrock-ping.txt "$RUNNER_TEMP/artifact/" 2> /dev/null || true

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/artifact
          retention-days: 14

      - name: Stop stack
        if: always()
        run: ./scripts/smoke.sh down
