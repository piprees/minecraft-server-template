version: 2

# Every PR opened here is reviewed by dep-review.yml, one agent run per
# distinct version set, so each group below is one review instead of many.
# The cooldown keeps day-one releases out of the auto-merge path.
#
# docker-compose.yml is not listed: its images are written as
# ${MIRROR_REGISTRY:-…}/image:tag, which Dependabot cannot parse.

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      actions-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - ci

  # Sidecar Dockerfiles: one PR per base image across every directory
  # (python:… in two, alpine:… in four).
  - package-ecosystem: docker
    directories:
      - /docker/*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      base-images:
        group-by: dependency-name
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
      - docker

  # Python: deps for the Discord sync bot
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      python-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
      - python
