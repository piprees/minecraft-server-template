name: Release Bundle

# Cut a release: gh workflow run release.yml -f version=v1.2.3
#
# Builds the stack bundle, creates the release as a DRAFT with the assets
# attached, then publishes it. This is the only order that works with
# immutable releases (assets cannot be added after publish - and consumers
# get the supply-chain guarantee that a published bundle never changes).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Consumers pinned to a major (STACK_VERSION=v5) take every release in it,
  # so a breaking commit (`type!:` or a BREAKING CHANGE footer; the merged
  # next-major worldgen PR is one) may only ship in a new major.
  semver:
    name: Version matches the changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Refuse a non-major release over breaking changes
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/check-release-version.sh "$VERSION"

  smoke-test:
    name: Smoke test
    needs: semver
    uses: ./.github/workflows/smoke-test.yml
    permissions:
      contents: read

  bundle:
    name: Build bundle and publish release
    needs: smoke-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # git-cliff needs full history; checkout defaults to --depth=1,
          # which truncates the notes and CHANGELOG to a single commit. The
          # "Fetch tags for changelog" step below restores tags, not depth.
          fetch-depth: 0

      - name: Validate version
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must be vX.Y.Z (got: ${{ inputs.version }})"
            exit 1
          fi

      - name: Read the Minecraft version
        id: mc
        # .minecraft-version through scripts/lib.sh: the JDK and the in-house
        # mod manifests follow it.
        run: |
          source scripts/lib.sh
          echo "java=$(mc_version_field java)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.mc.outputs.java }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build in-house mods
        # Ships the built jar from build/libs/ — never the -dev jar from
        # build/devlibs/. Dev jars use Yarn named mappings and carry no refmap,
        # so every mixin fails on a production server (intermediary names) and
        # the server crash-loops at boot.
        # -Pmod_version is what gives an artefact's stackVersion stamp meaning:
        # the jar reports the release that built it, so a checker can tell a
        # census from this stack from one an earlier stack left on disk.
        run: |
          MOD_VERSION="${{ inputs.version }}"
          ./scripts/local-mods.sh build server dist/local-mods --mod-version "${MOD_VERSION#v}"
          # Client-environment mods ship through the modpack, never to a server.
          ./scripts/local-mods.sh build client dist/client-mods --mod-version "${MOD_VERSION#v}"

      - name: Verify mod JARs
        # Guards against the empty/unremapped jar failure mode: compiled
        # classes, and the mixin refmap Loom generates while remapping unless
        # the manifest row declares a non-remapping build. An unremapped or
        # empty jar ships a production crash loop.
        run: |
          ./scripts/local-mods.sh verify server dist/local-mods
          ./scripts/local-mods.sh verify client dist/client-mods

      - name: Stamp version defaults
        # BEFORE the bundle: every stamped file is in its MANIFEST, so
        # stamping here means the tarball ships a correct pin even when the
        # commit-back below loses its race and no-ops.
        run: ./scripts/stamp-version-defaults.sh "${{ inputs.version }}"

      - name: Build bundle
        run: ./scripts/build-stack-bundle.sh "${{ inputs.version }}"

      - name: Verify declared local mods are in the bundle
        run: |
          BUNDLE="dist/stack-${{ inputs.version }}.tar.gz"
          tar -tzf "$BUNDLE" > "$RUNNER_TEMP/bundle.txt"
          while IFS='|' read -r JAR_NAME _; do
            grep -qx "stack/local-mods/$JAR_NAME" "$RUNNER_TEMP/bundle.txt" \
              || { echo "::error::Bundle is missing $JAR_NAME"; exit 1; }
          done < <(./scripts/local-mods.sh rows server)
          while IFS='|' read -r JAR_NAME _; do
            grep -qx "stack/client-mods/$JAR_NAME" "$RUNNER_TEMP/bundle.txt" \
              || { echo "::error::Bundle is missing client mod $JAR_NAME"; exit 1; }
          done < <(./scripts/local-mods.sh rows client)

      # One pin for release.yml and release-train.yml, kept in a plain file so
      # platform-updates.yml can bump it (GITHUB_TOKEN cannot push workflows).
      - name: Read the git-cliff version
        id: cliff
        run: echo "version=v$(tr -d '[:space:]' < .github/git-cliff-version)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        uses: orhun/git-cliff-action@v4.8.0
        with:
          version: ${{ steps.cliff.outputs.version }}
          # --unreleased --tag, not --latest: this runs BEFORE the release
          # is created, so the version being cut has no tag yet and --latest
          # resolves to the PREVIOUS release (v4.3.1 shipped v4.3.0's notes).
          args: >-
            --unreleased --tag ${{ inputs.version }}
            --strip header -o dist/RELEASE_NOTES.md

      - name: Fetch tags for changelog
        run: git fetch --tags --force

      - name: Generate full changelog
        # Must go through the action: git-cliff-action downloads the binary
        # into its own step and does NOT leave it on PATH — a bare git-cliff
        # in a run step fails with exit 127 (broke the first v3.1.0 cut).
        uses: orhun/git-cliff-action@v4.8.0
        with:
          version: ${{ steps.cliff.outputs.version }}
          # --tag for the same reason: without it the version being released
          # lands under an "Unreleased" heading in CHANGELOG.md.
          args: --tag ${{ inputs.version }} -o CHANGELOG.md

      - name: Create the draft release with its assets
        # Stays a draft until the images job has built every version-tagged
        # image: consumers resolve pins through the releases API, which
        # never lists drafts, so no consumer can pick up a bundle whose
        # images do not exist yet.
        run: |
          gh release create "${{ inputs.version }}" \
            dist/stack-*.tar.gz dist/stack-*.sha256 \
            --draft --notes-file dist/RELEASE_NOTES.md --target "${GITHUB_SHA}" \
            --title "${{ inputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the changelog and version defaults for the publish job
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            CHANGELOG.md
            .env.example
            examples/consumer/.env.example
            examples/consumer/.stack-version
            examples/consumer/.github/workflows/deploy.yml
          # Every version default is a dotfile or under .github; without this
          # the artefact carries CHANGELOG.md alone.
          include-hidden-files: true
          retention-days: 7

  # Rebuild all container images from this exact commit. publish.yml is
  # reusable (workflow_call); calling it here means the release run won't
  # complete until images are built — no more stale `latest` on deploy.
  # The push-to-main trigger on publish.yml also fires independently
  # (safety net for between-release fixes), but this is the authoritative
  # build for a release.
  images:
    name: Container images
    needs: bundle
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ inputs.version }}
    permissions:
      contents: read
      packages: write

  publish:
    name: Publish the release
    needs: [bundle, images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish the draft
        run: gh release edit "${{ inputs.version }}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the changelog and version defaults
        uses: actions/download-artifact@v8
        with:
          name: release-files

      - name: Commit CHANGELOG.md and version defaults
        # Best-effort after publishing: main can move during a release, so
        # rebase-and-retry and never fail the release over a changelog.
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .env.example examples/consumer/.env.example \
            examples/consumer/.stack-version examples/consumer/.github/workflows/deploy.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update CHANGELOG.md and version defaults for ${{ inputs.version }}"
            for attempt in 1 2 3; do
              git push origin HEAD:main && break
              echo "push rejected (attempt $attempt) — rebasing onto moved main"
              git pull --rebase origin main
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Advance major tag
        # Best-effort: consumers resolve symbolic pins via the releases API,
        # not this tag.
        continue-on-error: true
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MAJOR=$(echo "$VERSION" | grep -oE '^v[0-9]+')
          if [[ -n "$MAJOR" ]]; then
            git tag -f "$MAJOR" "${GITHUB_SHA}"
            git push origin "$MAJOR" --force
          fi
