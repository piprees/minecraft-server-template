name: Mod Updates

# Dependabot-style updates for Modrinth mods. Re-pins every mod in
# config/modrinth-mods.txt to its latest Fabric build for MC_VERSION, then opens
# (or refreshes) a PR with changelogs. Never touches production directly - this
# only runs against a checkout in the Actions runner.
on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC, matches dependabot.yml cadence
  workflow_dispatch:

permissions: {}

concurrency:
  group: mod-updates
  cancel-in-progress: false

env:
  BRANCH: mod-updates/auto

jobs:
  update-mods:
    name: Check for mod updates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create dependencies --color B8EE55 --force
          gh label create minecraft --color 44BD32 --description "Minecraft server/mod content" --force

      - name: Snapshot current mod lists
        run: |
          cp config/modrinth-mods.txt /tmp/modrinth-mods.before.txt
          cp modpack/adventure.mrpack.json /tmp/adventure.mrpack.before.json

      - name: Resolve latest mod versions (server + client manifest)
        run: ./scripts/pin-mod-versions.sh --apply

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- config/modrinth-mods.txt modpack/adventure.mrpack.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate worldgen presets from the new pins
        # The structure override datapacks are WHOLE-FILE copies of the pinned
        # jars' structure_set JSONs, and the adventure:wide/compressed noise
        # presets are cloned from the pinned Tectonic jar — a pin bump makes
        # them stale. Regenerate so the weekly PR carries the re-synced files;
        # baseline-drift warnings from the generators land in the PR body for
        # the reviewer.
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          python3 scripts/gen-structure-presets.py 2>&1 | tee /tmp/gen-structures.log
          python3 scripts/gen-terrain-presets.py 2>&1 | tee /tmp/gen-terrain.log
          {
            echo ""
            echo "## Worldgen presets regenerated"
            echo ""
            if git diff --quiet -- config/datapacks config/datapack-presets mods/custom-dimensions/src/main/resources; then
              echo "No preset content changed under the new pins."
            else
              echo "Preset files changed — review the diff. Generator warnings:"
              echo ""
              echo '```'
              grep -iE "warning|drift" /tmp/gen-structures.log /tmp/gen-terrain.log || echo "(none)"
              echo '```'
            fi
          } >> /tmp/gen-notes.md

      - name: Set up Java for in-house mods
        # Unconditional, unlike the presets step above: the census depends on
        # our own mod's structure sets (adventure:exit_shrines), not on a
        # Modrinth pin, so gating it on the pin diff would miss the exact
        # case it exists to catch. Build with the pinned toolchain
        # (mods/mise.toml uses Java 21), same setup as mod-build.yml, or the
        # runner's default JDK produces a broken jar.
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build in-house mods for the structure census
        # Same jar selection as mod-build.yml: the remapped jar from
        # build/libs/, never the -dev jar from build/devlibs/ — an
        # unremapped jar has no mixin refmap, and the census would silently
        # see a jar with no structure_set entries rather than fail.
        run: |
          while IFS='|' read -r jar_name project refmap; do
            [[ "$jar_name" == \#* || -z "$jar_name" ]] && continue
            echo "::group::Build mods/$project"
            (
              cd "mods/$project"
              gradle build
              JAR=$(find build/libs -name "${jar_name%.jar}-*.jar" ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)
              if [[ -z "$JAR" ]]; then
                echo "::error::No remapped jar found in mods/$project/build/libs"
                exit 1
              fi
              if ! unzip -l "$JAR" | grep -q "$refmap"; then
                echo "::error::$JAR is missing $refmap — output is unremapped or empty"
                exit 1
              fi
            )
            echo "::endgroup::"
          done < mods/local-mods.manifest

      - name: Regenerate the structure census
        # Unconditional, same reasoning as the Java/Gradle setup above: our
        # own mod's structure sets can drift with no Modrinth pin moving at
        # all. --check right after the write proves the regeneration is
        # self-consistent (the cache it just warmed makes the second pass
        # free of network calls) instead of trusting the write blindly; a
        # --check failure here means the generator is non-deterministic, not
        # that the census is merely stale, so it fails the job rather than
        # folding into the PR. `changed` records whether the committed
        # census actually moved, independent of the pin diff.
        id: census
        run: |
          set -euo pipefail
          python3 scripts/extract-structure-sets.py 2>&1 | tee /tmp/gen-census.log
          python3 scripts/extract-structure-sets.py --check
          python3 scripts/gen-structure-groups.py 2>&1 | tee -a /tmp/gen-census.log
          python3 scripts/gen-structure-groups.py --check
          CENSUS_PATHS=(
            scripts/data/structure-sets-extracted.json
            config/custom-dimensions/extractors/structures.json
            config/custom-dimensions/structure-groups.json
            mods/custom-dimensions/src/main/resources/structure_themes.json
          )
          if git diff --quiet -- "${CENSUS_PATHS[@]}"; then
            CENSUS_CHANGED=false
          else
            CENSUS_CHANGED=true
          fi
          echo "changed=$CENSUS_CHANGED" >> "$GITHUB_OUTPUT"
          {
            echo ""
            echo "## Structure census regenerated"
            echo ""
            if [[ "$CENSUS_CHANGED" == "false" ]]; then
              echo "No structure sets changed this week."
            else
              echo "Structure census changed — review the diff. Extractor warnings:"
              echo ""
              echo '```'
              grep -iE "warning|skip" /tmp/gen-census.log || echo "(none)"
              echo '```'
            fi
          } >> /tmp/gen-notes.md

      - name: Determine if the weekly PR needs updating
        # The pin diff alone used to gate everything below, so a week where
        # only the census moved (no pin changed) wrote fresh census files
        # and then discarded them — the job went green while the drift it
        # exists to catch persisted uncommitted. Anything below this step
        # runs on the union of the two.
        id: overall
        run: |
          if [[ "${{ steps.diff.outputs.changed }}" == "true" || "${{ steps.census.outputs.changed }}" == "true" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Close stale PR (no updates)
        if: steps.overall.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$PR_NUM" ]]; then
            gh pr comment "$PR_NUM" --body "Mods and the structure census both match \`main\` - closing, nothing left to update."
            gh pr close "$PR_NUM" --delete-branch
            echo "Closed stale PR #$PR_NUM"
          else
            echo "No mod or structure census updates available."
          fi

      - name: Build PR body with changelogs
        if: steps.overall.outputs.changed == 'true'
        id: body
        # count=0 on a census-only week (old and new pin snapshots are
        # identical) — build-mod-update-report.py handles that already, it
        # just writes "No mod version changes." Read count from the script's
        # own stdout rather than steps.body.outputs.count, which isn't set
        # until this step finishes.
        run: |
          set -euo pipefail
          python3 scripts/build-mod-update-report.py \
            --old /tmp/modrinth-mods.before.txt \
            --new config/modrinth-mods.txt \
            --server-env .env.example \
            --output /tmp/pr-body.md | tee /tmp/body-outputs.txt >> "$GITHUB_OUTPUT"
          cat /tmp/gen-notes.md >> /tmp/pr-body.md
          COUNT=$(grep '^count=' /tmp/body-outputs.txt | cut -d= -f2)
          if [[ "$COUNT" -gt 0 ]]; then
            echo "title=chore: update $COUNT mod version(s)" >> "$GITHUB_OUTPUT"
          else
            echo "title=chore: regenerate structure census" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.overall.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add config/modrinth-mods.txt modpack/adventure.mrpack.json \
            config/datapacks config/datapack-presets \
            mods/custom-dimensions/src/main/resources \
            scripts/data/structure-sets-extracted.json \
            config/custom-dimensions/extractors/structures.json \
            config/custom-dimensions/structure-groups.json
          git commit -m "${{ steps.body.outputs.title }}"
          git push --force origin "$BRANCH"

      - name: Open or update PR
        if: steps.overall.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$PR_NUM" ]]; then
            gh pr edit "$PR_NUM" \
              --title "${{ steps.body.outputs.title }}" \
              --body-file /tmp/pr-body.md
            gh pr comment "$PR_NUM" --body "Refreshed with the latest available mod versions and structure census ($(date -u +%Y-%m-%d))."
            echo "Updated PR #$PR_NUM"
          else
            gh pr create \
              --title "${{ steps.body.outputs.title }}" \
              --body-file /tmp/pr-body.md \
              --base main \
              --head "$BRANCH" \
              --label dependencies \
              --label minecraft
            echo "Opened new PR"
          fi
