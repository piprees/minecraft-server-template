name: Mod build

on:
  pull_request:
    paths:
      - 'mods/**'
  push:
    branches: [main]
    paths:
      - 'mods/**'

jobs:
  build-and-test:
    name: Build & test in-house mods
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      # Generated stylesheets are committed, not built by Gradle, so nothing
      # else notices when one stops matching its source. A stale file ships a
      # viewer whose rules silently stop applying.
      - name: Check generated stylesheets are current
        run: |
          for script in mods/*/build-viewer-css.sh; do
            [[ -x "$script" ]] || continue
            echo "::group::$script --check"
            "$script" --check
            echo "::endgroup::"
          done

      - name: Build & verify all mods from manifest
        run: |
          while IFS='|' read -r jar_name project refmap; do
            [[ "$jar_name" == \#* || -z "$jar_name" ]] && continue
            echo "::group::Build mods/$project"
            cd "mods/$project"
            gradle build
            JAR=$(find build/libs -name "${jar_name%.jar}-*.jar" ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)
            if [[ -z "$JAR" ]]; then
              echo "::error::No remapped jar found in mods/$project/build/libs"
              exit 1
            fi
            if ! unzip -l "$JAR" | grep -q "$refmap"; then
              echo "::error::$JAR is missing $refmap — output is unremapped or empty"
              exit 1
            fi
            CLASSES=$(unzip -l "$JAR" | grep -c '\.class$' || true)
            if [[ "$CLASSES" -lt 10 ]]; then
              echo "::error::$JAR contains only $CLASSES classes — remapJar output looks empty"
              exit 1
            fi
            echo "OK: $JAR ($CLASSES classes, $refmap present)"
            cd "$GITHUB_WORKSPACE"
            echo "::endgroup::"
          done < mods/local-mods.manifest
