name: Mod build

on:
  pull_request:
    paths:
      - 'mods/**'
  push:
    branches: [main]
    paths:
      - 'mods/**'

jobs:
  build-and-test:
    name: Build & test in-house mods
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      # Generated stylesheets are committed, not built by Gradle, so nothing
      # else notices when one stops matching its source. A stale file ships a
      # viewer whose rules silently stop applying.
      - name: Check generated stylesheets are current
        run: |
          for script in mods/*/build-viewer-css.sh; do
            [[ -x "$script" ]] || continue
            echo "::group::$script --check"
            "$script" --check
            echo "::endgroup::"
          done

      # The gate mirrors release.yml through one script: Gradle reports BUILD
      # SUCCESSFUL even for an empty or unremapped jar. Client mods share it
      # with a floor of 1 class and must declare environment client.
      - name: Build & verify the in-house mods from their manifests
        run: |
          ./scripts/local-mods.sh build server "$RUNNER_TEMP/local-mods"
          ./scripts/local-mods.sh verify server "$RUNNER_TEMP/local-mods"
          ./scripts/local-mods.sh build client "$RUNNER_TEMP/client-mods"
          ./scripts/local-mods.sh verify client "$RUNNER_TEMP/client-mods"
