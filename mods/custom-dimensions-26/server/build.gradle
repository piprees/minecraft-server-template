plugins {
	id 'net.fabricmc.fabric-loom'
}

base {
	archivesName = 'customdimensions'
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation project(':core')
	implementation project(':compiler')
	include project(':core')
	include project(':compiler')
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
}

loom {
	runs {
		server {
			programArg '--nogui'
			// -PselfTest=<file> runs the start-up self-test, writes its report and stops the server.
			vmArg "-Dcustomdimensions.selftest=${project.findProperty('selfTest') ?: ''}"
			// The self-test compiles definitions/ against vanilla's files and decodes the result.
			vmArg "-Dcustomdimensions.definitions=${file('../definitions').canonicalPath}"
			vmArg "-Dcustomdimensions.vanilla=${project(':compiler').layout.buildDirectory.dir("vanilla/${project.minecraft_version}").get().asFile.absolutePath}"
		}
	}
}

tasks.matching { it.name == 'runServer' }.configureEach {
	dependsOn ':compiler:vanillaData'
}
