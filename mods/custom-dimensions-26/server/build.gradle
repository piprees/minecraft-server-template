plugins {
	id 'net.fabricmc.fabric-loom'
}

base {
	archivesName = 'customdimensions'
}

repositories {
	maven {
		name = 'Nucleoid'
		url = 'https://maven.nucleoid.xyz/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Runtime levels (decisions.md RB-10). LGPL, nested unmodified.
	implementation "xyz.nucleoid:fantasy:${project.fantasy_version}"
	include "xyz.nucleoid:fantasy:${project.fantasy_version}"

	// The portal block (decisions.md RB-11, RB-26). Loom's include is not transitive, so each module is nested.
	// polymer-blocks and polymer-resource-pack: the tinted portal states and the per-player pack check.
	for (module in ['polymer-core', 'polymer-common', 'polymer-networking', 'polymer-reg-sync-manipulator',
			'polymer-blocks', 'polymer-resource-pack']) {
		implementation "eu.pb4:${module}:${project.polymer_version}"
		include "eu.pb4:${module}:${project.polymer_version}"
	}

	// Open Parties and Claims, for the aura claim veto in runServer only; the mod reaches it by reflection.
	localRuntime "maven.modrinth:open-parties-and-claims:${project.opac_version}"
	localRuntime "maven.modrinth:forge-config-api-port:${project.forge_config_api_port_version}"
	// -PfirewallProbe: The Lost Cities, a 26.3 Fabric mod adding the dimension lostcities:lostcity, so the firewall refuses to start.
	if (project.hasProperty('firewallProbe')) {
		localRuntime "maven.modrinth:the-lost-cities:${project.lostcities_version}"
	}
	// Distant Horizons' API for the LOD generator (lod/), used only when DH is installed; never nested.
	compileOnly "maven.modrinth:distanthorizons:${project.distant_horizons_version}"
	// -Pdh: Distant Horizons on the server, so a rig client with it is sent LODs the server generates (the rig's --dh).
	if (project.hasProperty('dh')) {
		localRuntime "maven.modrinth:distanthorizons:${project.distant_horizons_version}"
	}
	// -PstructureMods=<dir>: the 26.3 list's structure mods (the jars the committed bridges adopt, their libraries), for measuring sizes.
	if (project.hasProperty('structureMods')) {
		def dir = file(project.property('structureMods'))
		def wanted = ['ATi Structure', 'Epic Dungeons', 'deadly-deadly-dungeon', 'dungeons-and-taverns', 't_and_t-fabric',
				'MoogsEndStructures', 'MoogsNetherStructures', 'MoogsSoaringStructures', 'MoogsTemplesReimagined',
				'MoogsVoyagerStructures', 'MoogsStructureLib', 'cristellib']
		localRuntime files(dir.listFiles().findAll { f -> f.name.endsWith('.jar') && wanted.any { f.name.startsWith(it) } }.sort())
	}

	implementation project(':core')
	implementation project(':compiler')
	include project(':core')
	include project(':compiler')

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The server resource pack that tints portals for unmodded clients, built from the
// vanilla client jar Loom keeps and nested in the jar (PortalTints.PACK_RESOURCE).
def serverPackDir = layout.buildDirectory.dir('generated/server-pack')
def clientJar = new File(gradle.gradleUserHomeDir, "caches/fabric-loom/${project.minecraft_version}/minecraft-client.jar")
configurations {
	serverPackTool
}
dependencies {
	serverPackTool project(':core')
}
def serverPack = tasks.register('serverPack', JavaExec) {
	group = 'custom-dimensions'
	description = 'Builds the portal tint resource pack from the vanilla client jar.'
	def out = serverPackDir.get().file('customdimensions/server-pack.zip').asFile
	classpath = configurations.serverPackTool
	mainClass = 'com.customdimensions.core.portal.TintPackWriter'
	inputs.file clientJar
	outputs.file out
	args clientJar.absolutePath, out.absolutePath
	doFirst {
		if (!clientJar.isFile()) {
			throw new GradleException("no Minecraft client jar at ${clientJar}: Loom fetches it when the project configures")
		}
	}
}

processResources {
	def version = project.version
	inputs.property 'version', version
	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
	dependsOn serverPack
	from serverPackDir
	from(rootProject.file('THIRD_PARTY_NOTICES.md'))
}

// -PselfTest adds the fixture dimensions in src/selftest/definitions to a copy of
// definitions/; runServer reads that copy. The release jar never carries them.
def selfTestRun = project.hasProperty('selfTest') && !project.hasProperty('definitions')
def selfTestDefinitions = layout.buildDirectory.dir('selftest-definitions')
// It also adds each library terrain's default from src/selftest/gallery; -PterrainGallery=<dir> adds every
// gallery setting and renders them all into <dir>.
tasks.register('selfTestDefinitions', Sync) {
	from file('../definitions')
	from file('src/selftest/definitions')
	from(file('src/selftest/gallery')) {
		if (!project.hasProperty('terrainGallery')) include '*_default.json'
	}
	into selfTestDefinitions
}

loom {
	runs {
		server {
			programArg '--nogui'
			// -PselfTest=<file> runs the start-up self-test, writes its report and stops the server.
			vmArg "-Dcustomdimensions.selftest=${project.findProperty('selfTest') ?: ''}"
			// -PselfTestOnly=exits|commands|materials|biomes|render|firewall|terrain|zones|structures|roll|rollperf|generators|difficulty|survey|seeds|gamerules|mixins|lod: the compiled-pack section and that one only.
			vmArg "-Dcustomdimensions.selftest.only=${project.findProperty('selfTestOnly') ?: ''}"
			vmArg "-Dcustomdimensions.selftest.gallery=${project.findProperty('terrainGallery') ?: ''}"
			// -PselfTestPersist=write|verify: the two-boot persistence check, run with the self-test.
			vmArg "-Dcustomdimensions.selftest.persist=${project.findProperty('selfTestPersist') ?: ''}"
			// -PmeasureStructures=<file>: measure every registered structure's start, write the sizes and the bridges' size slots, stop.
			vmArg "-Dcustomdimensions.structuresizes=${project.findProperty('measureStructures') ?: ''}"
			// The mod compiles definitions/ into the world's pack at start-up from the running game's vanilla files,
			// as in production. -Pdefinitions=<dir> runs against another definitions folder.
			vmArg "-Dcustomdimensions.definitions=${project.findProperty('definitions') ?: (selfTestRun ? selfTestDefinitions.get().asFile.absolutePath : file('../definitions').canonicalPath)}"
			// The firewall's bridges, as config/custom-dimensions/bridges/ holds them in production. -Pbridges=<dir> reads another folder.
			vmArg "-Dcustomdimensions.bridges=${project.findProperty('bridges') ?: file('../bridges').canonicalPath}"
			// The extracted vanilla files, only for the self-test's equivalence line against the running game.
			// With -Pdh, Distant Horizons checks every column the LOD generator gives it (DhLodGenerator.VALIDATE_PROPERTY).
			if (project.hasProperty('dh')) vmArg '-Dcustomdimensions.dh.validate=true'
			// -PselfTestLod=<slug>[,<slug>...]: the dimensions the self-test's LOD section checks (default overworld, the_nether, the_aviary).
			vmArg "-Dcustomdimensions.selftest.lod=${project.findProperty('selfTestLod') ?: ''}"
			vmArg "-Dcustomdimensions.vanilla.reference=${project(':compiler').layout.buildDirectory.dir("vanilla/${project.minecraft_version}").get().asFile.absolutePath}"
		}
	}
}

// runFastBench -PfastBench=<slug>:<seed>:<radius>:<step|wave|map>:<threads>[,...] [-PfastBenchOut=<dir>] [-PfastBenchJvm='<flags>']:
// the headless fast render benchmark (FastBench): loads the registries and the compiled pack, renders, exits. No world or network.
loom {
	runs {
		fastBench {
			server()
			name 'Fast render benchmark'
			runDir 'run-bench'
			programArg '--initSettings'
			vmArg '-Xmx3G'
			vmArg "-Dcustomdimensions.fastbench=${project.findProperty('fastBench') ?: ''}"
			vmArg "-Dcustomdimensions.fastbench.out=${project.findProperty('fastBenchOut') ?: file('run-bench/out').absolutePath}"
			vmArg "-Dcustomdimensions.fastbench.repeat=${project.findProperty('fastBenchRepeat') ?: '2'}"
			// -PfastBenchLod=<detail>[,<detail>...]: instead of rendering, compares the LOD generator's coarse shortcut at each
			// detail level with whole columns (LodBench), one line per case and level in summary.txt.
			vmArg "-Dcustomdimensions.fastbench.lod=${project.findProperty('fastBenchLod') ?: ''}"
			// -PfastBenchLodColumns='<x>:<z>[;<x>:<z>...]': with -PfastBenchLod, also prints those columns' full-detail LOD runs beside the noise column.
			vmArg "-Dcustomdimensions.fastbench.lod.columns=${project.findProperty('fastBenchLodColumns') ?: ''}"
			// -PfastBenchRegions=<dir>: with a map case, also draws the explored layer from <dir>/<slug>/region/*.mca.
			vmArg "-Dcustomdimensions.fastbench.regions=${project.findProperty('fastBenchRegions') ?: ''}"
			vmArg "-Dcustomdimensions.definitions=${project.findProperty('definitions') ?: file('../definitions').canonicalPath}"
			vmArg "-Dcustomdimensions.bridges=${project.findProperty('bridges') ?: file('../bridges').canonicalPath}"
			if (project.hasProperty('fastBenchJvm')) {
				project.property('fastBenchJvm').toString().split(' ').each { vmArg it }
			}
		}
	}
}

tasks.matching { it.name == 'runFastBench' }.configureEach {
	dependsOn ':compiler:vanillaData'
}

tasks.matching { it.name == 'runServer' }.configureEach {
	dependsOn ':compiler:vanillaData'
	if (selfTestRun) {
		dependsOn 'selfTestDefinitions'
	}
}

tasks.named('test') {
	dependsOn ':compiler:vanillaData'
	systemProperty 'customdimensions.vanilla',
			project(':compiler').layout.buildDirectory.dir("vanilla/${project.minecraft_version}").get().asFile.absolutePath
	systemProperty 'customdimensions.definitions', file('../definitions').canonicalPath
	// -PwriteFixtures rewrites the companion wire fixtures, which the companion client keeps a copy of.
	systemProperty 'customdimensions.fixtures.write',
			project.hasProperty('writeFixtures') ? file('src/test/resources/companion-fixtures').absolutePath : ''
}
