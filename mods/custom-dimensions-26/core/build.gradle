plugins {
	id 'java-library'
}

dependencies {
	api "com.google.code.gson:gson:${project.gson_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testImplementation "com.networknt:json-schema-validator:${project.json_schema_validator_version}"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// core stays free of Minecraft and Fabric; the compiler and server modules carry those.
def noMinecraft = tasks.register('checkNoMinecraftImports') {
	def sources = fileTree('src') { include '**/*.java' }
	inputs.files(sources)
	doLast {
		def pattern = ~/(?m)^\s*import\s+(static\s+)?net\.(minecraft|fabricmc)\./
		def offenders = sources.files.findAll { pattern.matcher(it.text).find() }
		if (!offenders.isEmpty()) {
			throw new GradleException("core must not import Minecraft or Fabric:\n  "
					+ offenders.collect { projectDir.toPath().relativize(it.toPath()) }.join('\n  '))
		}
	}
}
tasks.named('check') { dependsOn noMinecraft }

// -Pjar=<structure mod jar or datapack zip> -Pout=<dir> [-Pmod=<id>]: writes a first, unreviewed bridge for a human to tag.
tasks.register('bridge', JavaExec) {
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.customdimensions.core.firewall.BridgeGenerator'
	args = [project.findProperty('jar') ?: '', project.findProperty('out') ?: '', project.findProperty('mod') ?: ''].findAll { it }
}
