org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.14
fabric_version=0.115.0+1.21.1

# Overridden by release.yml with the release tag, so a shipped jar stamps its
# artefacts with the stack that built it. A local build keeps this marker,
# which the checkers read as "no release identity, don't compare".
#
# Not "-dev": that suffix is Loom's unremapped jar, which release.yml and
# `./dev link` both filter out, so the local build would be skipped entirely.
mod_version=0.0.0-local
maven_group=com.customdimensions
archives_base_name=customdimensions
