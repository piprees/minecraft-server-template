name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    uses: piprees/minecraft-server-template/.github/workflows/deploy-reusable.yml@v5
    with:
      # Set the STACK_VERSION variable to pin a release line (v5) or an exact
      # version (v5.6.1); unset = latest release.
      #
      # It must be a REPOSITORY variable, not an environment one. This job
      # declares no `environment:`, so `vars.` resolves against repository
      # variables only — an environment variable of the same name is invisible
      # here and is silently ignored. Setting only the environment copy leaves
      # this expression on its 'latest' fallback (or on a stale repository
      # value), which pins the server to whatever line that resolves to and
      # makes every later deploy a no-op that still reports success.
      stack_version: ${{ vars.STACK_VERSION || 'latest' }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      RCON_PASSWORD: ${{ secrets.RCON_PASSWORD }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_CHAT_CHANNEL_ID: ${{ secrets.DISCORD_CHAT_CHANNEL_ID }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
      KUMA_API_KEY: ${{ secrets.KUMA_API_KEY }}
      KUMA_PASSWORD: ${{ secrets.KUMA_PASSWORD }}
