name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stack_version:
        description: >-
          Deploy this release instead of .stack-version for one run (e.g. a
          rollback to v5.6.1). Empty = .stack-version.
        required: false
        type: string
        default: ''

jobs:
  deploy:
    uses: piprees/minecraft-server-template/.github/workflows/deploy-reusable.yml@v5
    # The stack release comes from .stack-version at the repo root (an exact
    # vX.Y.Z; the weekly Updates workflow proposes bumps). The @vN major here
    # must match it - the deploy refuses a stack from another major.
    with:
      stack_version_override: ${{ inputs.stack_version || '' }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      RCON_PASSWORD: ${{ secrets.RCON_PASSWORD }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_CHAT_CHANNEL_ID: ${{ secrets.DISCORD_CHAT_CHANNEL_ID }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_TUNNEL_ID: ${{ secrets.CLOUDFLARE_TUNNEL_ID }}
      KUMA_API_KEY: ${{ secrets.KUMA_API_KEY }}
      KUMA_PASSWORD: ${{ secrets.KUMA_PASSWORD }}
